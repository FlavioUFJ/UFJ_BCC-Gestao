<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Sistema de Gestão de Estágios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #f5576c;
            --success-color: #4facfe;
            --warning-color: #43e97b;
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
        }

        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }



        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.3rem 0;
            z-index: 1030;
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .navbar-nav .nav-link {
            color: #333 !important;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #667eea !important;
            transform: translateY(-1px);
        }

        .navbar-text {
            color: #333 !important;
        }

        .btn-outline-danger {
            border-color: #dc3545;
            color: #dc3545;
            background: transparent;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        /* Fix para sobreposição do dropdown menu */
        .dropdown-menu {
            z-index: 1050 !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15) !important;
            border: none !important;
            border-radius: 8px !important;
        }

        .dropdown-toggle::after {
            margin-left: 0.5em;
        }

        /* Garantir que botões não interfiram no dropdown */
        .btn-outline-light {
            z-index: 1020;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--hover-shadow);
        }

        .card-header {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: var(--success-color);
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-warning {
            background: var(--warning-color);
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.8rem;
            color: #333;
            transition: all 0.3s ease;
        }

        .btn-warning:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
        }

        .btn-danger {
            background: var(--secondary-color);
            border: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background: #e04c5d;
            box-shadow: 0 2px 8px rgba(245, 87, 108, 0.3);
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 12px 20px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-1px);
        }

        .alert {
            border: none;
            border-radius: 15px;
            padding: 1rem 1.5rem;
        }

        .alert-success {
            background: rgba(67, 233, 123, 0.1);
            border-left: 4px solid #43e97b;
            color: #155724;
        }

        .alert-danger {
            background: rgba(245, 87, 108, 0.1);
            border-left: 4px solid #f5576c;
            color: #721c24;
        }

        .table {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            overflow: hidden;
        }

        .table thead th {
            background: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .table tbody tr {
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
            transform: scale(1.01);
        }

        .badge {
            border-radius: 50px;
            padding: 0.5rem 1rem;
            font-weight: 500;
        }

        .badge-success {
            background: var(--warning-color);
            color: #333;
        }

        .badge-warning {
            background: var(--secondary-color);
            color: white;
        }

        .stats-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .stats-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-label {
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 0.9rem;
        }

        .floating-btn:hover {
            background: #5a6fd8;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e9ecef;
            border-radius: 6px;
        }

        .text-gradient {
            color: var(--primary-color) !important;
            font-weight: 600;
        }

        .icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    

    <main class="">
        <div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card fade-in-up">
                <div class="card-header text-center">
                    <div class="icon-wrapper mx-auto mb-2">
                        <i class="fas fa-key"></i>
                    </div>
                    <h4 class="mb-1" style="color: #ffffff !important; font-weight: 600;">Recuperar Senha</h4>
                    <p class="mb-0 small" style="color: #e0e0e0 !important;">Redefinir senha do coordenador</p>
                </div>
                <div class="card-body p-3">
                    
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>Token inválido ou expirado. Solicite uma nova recuperação de senha.
                        </div>
                        
                        
                    
                    
                    
                    

                    
                    <form method="POST" action="/auth/forgot-password">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">
                                Digite seu e-mail
                            </label>
                            <div class="position-relative">
                                <input type="email" class="form-control ps-4" id="email" name="email" required>
                                <i class="fas fa-envelope position-absolute" style="left: 12px; top: 50%; transform: translateY(-50%); color: #667eea; font-size: 0.9rem;"></i>
                            </div>
                        </div>
                        

                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-paper-plane me-2"></i>Gerar Nova Senha
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="/login" class="text-decoration-none" style="color: #667eea; font-size: 0.9rem;">
                                <i class="fas fa-arrow-left me-1"></i>Voltar ao Login
                            </a>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <div class="rounded p-2" style="background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
                            <h6 class="mb-1" style="font-size: 0.9rem; color: #ffffff !important; font-weight: 600;">
                                <i class="fas fa-graduation-cap me-1"></i>Universidade Federal de Jataí
                            </h6>
                            <small style="font-size: 0.75rem; color: #e0e0e0 !important;">Curso de Ciência da Computação</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.position-relative input:focus + i {
    color: #764ba2 !important;
    transform: translateY(-50%) scale(1.1);
    transition: all 0.3s ease;
}
</style>
    </main>

    <!-- Rodapé com identificação dos desenvolvedores -->
    <footer class="mt-5 py-3" style="background: rgba(102, 126, 234, 0.1); border-top: 1px solid rgba(102, 126, 234, 0.2);">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="mb-0" style="font-size: 0.85rem; color: #6c757d;">
                        <i class="fas fa-code me-1"></i>
                        Desenvolvido por <strong>Flavio Ferreira Borges</strong> com <strong>IA Trae</strong> (2025)
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
